name: Publish v1

on:
  push:
    branches:
      - main
    paths:
      - action.yml
      - README.md
      - verification.md
      - tools/drift-check/index.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the floating v1 tag to the reviewed main commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force --annotate v1 "$GITHUB_SHA" --message "Drift Check v1"
          git push --force origin refs/tags/v1
          test "$(git rev-list -n 1 v1)" = "$GITHUB_SHA"
